<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>中文寫作評語系統 · 坦克出品</title>
<style>
:root{
  --bg1:#eef2ff; --bg2:#f8fafc; --bg3:#fce7f3;
  --surface:rgba(255,255,255,0.72);
  --surface-solid:#ffffff;
  --border:rgba(148,163,184,0.28);
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --primary:#6366f1; --primary-d:#4f46e5;
  --accent:#8b5cf6; --success:#10b981; --success-d:#059669;
  --danger:#ef4444; --warn:#f59e0b;
  --chip:rgba(99,102,241,0.08);
  --shadow:0 20px 50px -20px rgba(30,41,59,0.28);
  --shadow-sm:0 4px 14px -6px rgba(30,41,59,0.18);
  --radius:20px;
  --blur:18px;
  --tap:46px;
}
html[data-theme="dark"]{
  --bg1:#0b1120; --bg2:#0f172a; --bg3:#1e1b4b;
  --surface:rgba(30,41,59,0.55);
  --surface-solid:#1e293b;
  --border:rgba(148,163,184,0.18);
  --text:#e2e8f0; --muted:#94a3b8; --faint:#64748b;
  --chip:rgba(129,140,248,0.14);
  --shadow:0 20px 50px -20px rgba(0,0,0,0.6);
  --shadow-sm:0 4px 14px -6px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{margin:0;padding:0;}
button,input,select,textarea{touch-action:manipulation;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;
  color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:var(--bg2);transition:color .3s ease;padding:20px 14px 60px;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1200px 600px at 10% -10%,var(--bg1),transparent 55%),
    radial-gradient(1000px 500px at 110% 10%,var(--bg3),transparent 50%),
    var(--bg2);
  transition:background .5s ease;
}
@supports(padding:max(0px)){
  body{
    padding-top:max(20px,env(safe-area-inset-top));
    padding-left:max(14px,env(safe-area-inset-left));
    padding-right:max(14px,env(safe-area-inset-right));
  }
}
.wrap{max-width:1180px;margin:0 auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;}
.logo{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;
  background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 10px 24px -8px var(--primary);}
.brand h1{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:.3px;}
.brand p{margin:2px 0 0;font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:1px;}
.top-actions{display:flex;align-items:center;gap:10px;}
.stat-pill{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-radius:14px;padding:8px 14px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;line-height:1.25;box-shadow:var(--shadow-sm);}
.stat-pill b{color:var(--text);font-size:1.05rem;font-weight:800;}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:14px;border:1px solid var(--border);background:var(--surface);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));color:var(--text);font-size:1.2rem;cursor:pointer;
  display:grid;place-items:center;transition:transform .15s,background .3s;box-shadow:var(--shadow-sm);flex:none;}
.icon-btn:active{transform:scale(.92);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:20px;margin-bottom:18px;}
.section-title{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin:0 0 12px;}
.section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;}
.levels{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);padding:6px;border-radius:16px;margin-bottom:18px;
  overflow-x:auto;backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--shadow-sm);
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.level-btn{flex:1;min-width:96px;border:none;background:transparent;cursor:pointer;padding:11px 10px;border-radius:11px;
  font-weight:700;font-size:.9rem;color:var(--muted);transition:all .28s cubic-bezier(.4,0,.2,1);
  white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:var(--tap);justify-content:center;}
.level-btn small{font-size:.68rem;font-weight:600;opacity:.75;}
.level-btn.active{color:#fff;box-shadow:0 8px 20px -8px var(--primary);}
.level-btn[data-level="ALL"].active{background:linear-gradient(135deg,#64748b,#475569);}
.level-btn[data-level="【上品】"].active{background:linear-gradient(135deg,#f59e0b,#f97316);box-shadow:0 8px 20px -8px #f59e0b;}
.level-btn[data-level="【中品】"].active{background:linear-gradient(135deg,#6366f1,#4f46e5);}
.level-btn[data-level="【下品】"].active{background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 8px 20px -8px #0ea5e9;}
.level-btn[data-level="【SEN】"].active{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 20px -8px #10b981;}
.lib-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;}
.lib-bar .lib-title{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px;}
.lib-bar .lib-title b{background:var(--accent);color:#fff;border-radius:10px;padding:1px 9px;font-size:.82rem;}
.lib-actions{display:flex;gap:8px;flex-wrap:wrap;}
.lib-bar .lib-actions{margin-left:auto;}
.lib-actions button{border:1.5px solid var(--border);background:var(--surface-solid);color:var(--text);
  border-radius:10px;padding:11px 14px;font-size:.84rem;font-weight:700;cursor:pointer;transition:transform .12s,border-color .2s;min-height:var(--tap);}
.lib-actions button:active{transform:scale(.95);}
.lib-actions .prim{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border-color:transparent;}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.field label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:5px;}
.field label .opt{color:var(--faint);font-weight:600;}
.field input{width:100%;padding:12px 14px;font-size:16px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--surface-solid);color:var(--text);transition:border-color .2s,box-shadow .2s;min-height:var(--tap);}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.16);}
/* Rubric */
.rubric-grid{display:grid;grid-template-columns:1fr 1fr 1fr 200px;gap:18px;align-items:center;}
.rub{padding:2px 0;}
.rub .rlab{display:flex;align-items:baseline;justify-content:space-between;font-size:.82rem;font-weight:700;margin-bottom:10px;}
.rub .rlab .w{font-size:.68rem;color:var(--faint);font-weight:600;}
.rub .rval{color:var(--primary);font-size:1.1rem;font-weight:800;}
.rub input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;
  background:linear-gradient(90deg,var(--primary) 0%,var(--accent) 100%);outline:none;cursor:pointer;}
.rub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
  background:#fff;border:3px solid var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;transition:transform .12s;}
.rub input[type=range]::-webkit-slider-thumb:active{transform:scale(1.15);}
.rub input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:pointer;}
.rub .rscale{display:flex;justify-content:space-between;font-size:.62rem;color:var(--faint);margin-top:6px;}
.grade-badge{display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:12px 6px;height:100%;min-height:96px;box-shadow:0 8px 20px -8px var(--primary);}
.grade-badge small{font-size:.64rem;opacity:.9;font-weight:600;letter-spacing:1px;}
.grade-badge b{font-size:2rem;font-weight:800;line-height:1;margin:3px 0;}
.grade-badge .glvl{font-size:.72rem;font-weight:700;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:20px;}
/* Roster */
.stu-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.stu-list::-webkit-scrollbar{width:6px;}
.stu-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.stu{display:flex;align-items:center;gap:11px;padding:12px;border:1.5px solid var(--border);border-radius:12px;
  background:var(--surface-solid);cursor:pointer;transition:border-color .2s,transform .15s,background .2s;min-height:var(--tap);}
.stu:active{transform:scale(.99);}
.stu.active{border-color:var(--primary);background:var(--chip);box-shadow:0 0 0 2px rgba(99,102,241,.15);}
.stu .avatar{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;
  font-size:1rem;background:linear-gradient(135deg,var(--primary),var(--accent));}
.stu .stu-meta{flex:1;min-width:0;display:flex;flex-direction:column;}
.stu .stu-name{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stu .stu-sub{font-size:.72rem;color:var(--muted);}
.stu .stu-grade{font-size:.68rem;font-weight:800;color:#fff;background:var(--accent);border-radius:7px;padding:2px 8px;flex:none;}
.stu .stu-del{width:36px;height:36px;flex:none;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .15s;}
.stu .stu-del:active{color:var(--danger);border-color:var(--danger);}
.stu .stu-del svg{width:16px;height:16px;}
.modules{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.mod-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.mod-ico{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:1.1rem;color:#fff;}
.mod-ico.i-str{background:linear-gradient(135deg,#f59e0b,#f97316);}
.mod-ico.i-c{background:linear-gradient(135deg,#ec4899,#db2777);}
.mod-ico.i-e{background:linear-gradient(135deg,#8b5cf6,#6d28d9);}
.mod-ico.i-s{background:linear-gradient(135deg,#10b981,#059669);}
.mod-head .mh-txt{flex:1;min-width:0;}
.mod-head .t{font-weight:800;font-size:1rem;}
.mod-head .s{font-size:.74rem;color:var(--muted);}
.add-mini{border:1.5px solid var(--border);background:var(--surface-solid);color:var(--accent);border-radius:9px;
  padding:9px 12px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .12s;}
.add-mini:active{transform:scale(.93);}
.count-badge{background:var(--primary);color:#fff;font-size:.72rem;font-weight:800;min-width:26px;height:26px;
  padding:0 7px;border-radius:13px;display:grid;place-items:center;transition:transform .2s;flex:none;}
.count-badge.zero{background:var(--faint);opacity:.6;}
.search-box{position:relative;margin-bottom:10px;}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);}
.search-box input{width:100%;padding:12px 14px 12px 36px;font-size:16px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface-solid);color:var(--text);min-height:var(--tap);}
.search-box input:focus{outline:none;border-color:var(--primary);}
.subcats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.subcat{flex:none;font-size:.78rem;font-weight:600;padding:9px 14px;border-radius:20px;cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--muted);white-space:nowrap;transition:all .2s;min-height:38px;}
.subcat.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.item-list{max-height:260px;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.item-list::-webkit-scrollbar{width:6px;}
.item-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.item{position:relative;padding:12px 12px 12px 36px;border-radius:11px;cursor:pointer;font-size:.9rem;border:1.5px solid var(--border);
  background:var(--surface-solid);color:var(--text);transition:all .18s;line-height:1.55;}
.item:active{border-color:var(--primary);}
.item.sel{border-color:var(--primary);background:var(--chip);}
.item.is-custom{padding-right:72px;}
.item .tick{position:absolute;left:10px;top:13px;width:20px;height:20px;border-radius:6px;border:1.6px solid var(--faint);
  display:grid;place-items:center;transition:all .18s;}
.item.sel .tick{background:var(--primary);border-color:var(--primary);}
.item .tick svg{width:13px;height:13px;color:#fff;opacity:0;transition:opacity .15s;}
.item.sel .tick svg{opacity:1;}
.item .cat-tag{display:inline-block;font-size:.66rem;font-weight:700;color:var(--primary);background:var(--chip);
  padding:1px 7px;border-radius:6px;margin-bottom:3px;}
.item .custom-tag{display:inline-block;font-size:.66rem;font-weight:700;color:#fff;background:var(--accent);
  padding:1px 7px;border-radius:6px;margin-bottom:3px;margin-left:4px;}
.item-acts{position:absolute;right:8px;top:8px;display:flex;gap:4px;}
.item-acts button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .15s;}
.item-acts button:active{color:var(--text);border-color:var(--primary);}
.item-acts button.del:active{color:var(--danger);border-color:var(--danger);}
.item-acts svg{width:15px;height:15px;}
.empty{padding:22px;text-align:center;color:var(--faint);font-size:.85rem;line-height:1.6;}
/* Selected / reorder panel */
.sel-panel{background:var(--surface-solid);border:1.5px dashed var(--border);border-radius:14px;padding:12px;
  margin-bottom:16px;max-height:340px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.sel-panel::-webkit-scrollbar{width:6px;}
.sel-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.sel-group{margin-bottom:12px;}
.sel-group:last-child{margin-bottom:0;}
.sel-group-title{font-size:.76rem;font-weight:800;color:var(--muted);margin-bottom:6px;letter-spacing:.3px;}
.sel-item{display:flex;align-items:center;gap:8px;padding:10px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface);margin-bottom:6px;transition:border-color .15s,opacity .15s,box-shadow .15s;}
.sel-item:last-child{margin-bottom:0;}
.sel-item.dragging{opacity:.4;border-color:var(--primary);border-style:dashed;}
.sel-item.dragover{border-color:var(--primary);box-shadow:0 -3px 0 var(--primary);}
.sel-item .grip{color:var(--faint);cursor:grab;flex:none;display:grid;place-items:center;touch-action:none;padding:4px;}
.sel-item .grip svg{width:20px;height:20px;}
.sel-item .sel-body{flex:1;min-width:0;font-size:.86rem;line-height:1.5;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.sel-btns{display:flex;gap:4px;flex:none;}
.sel-btns button{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface-solid);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .15s;}
.sel-btns button:active{color:var(--text);border-color:var(--primary);}
.sel-btns button.rmv:active{color:var(--danger);border-color:var(--danger);}
.sel-btns svg{width:16px;height:16px;}
/* Tone */
.tone-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.tone-label{font-size:.82rem;font-weight:700;color:var(--muted);}
.tone-seg{display:flex;gap:4px;background:var(--surface-solid);border:1.5px solid var(--border);border-radius:12px;padding:4px;flex-wrap:wrap;}
.tone-seg button{border:none;background:transparent;padding:11px 14px;border-radius:9px;font-size:.84rem;font-weight:700;
  color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;min-height:42px;}
.tone-seg button.active{color:#fff;}
.tone-seg button[data-tone="soft"].active{background:linear-gradient(135deg,#10b981,#059669);}
.tone-seg button[data-tone="std"].active{background:linear-gradient(135deg,#6366f1,#4f46e5);}
.tone-seg button[data-tone="strict"].active{background:linear-gradient(135deg,#f59e0b,#f97316);}
.out-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.toggles{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap;}
.tgl{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);cursor:pointer;user-select:none;min-height:38px;}
.tgl input{display:none;}
.tgl .sw{width:42px;height:24px;border-radius:20px;background:var(--faint);position:relative;transition:background .2s;flex:none;}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;}
.tgl input:checked + .sw{background:var(--primary);}
.tgl input:checked + .sw::after{transform:translateX(18px);}
textarea{width:100%;min-height:220px;padding:16px;font-size:16px;line-height:1.9;border-radius:14px;border:1.5px solid var(--border);
  background:var(--surface-solid);color:var(--text);resize:vertical;font-family:inherit;}
textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.14);}
.wc{font-size:.78rem;color:var(--muted);margin-top:6px;text-align:right;}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.btn{border:none;border-radius:12px;padding:14px 18px;font-size:.92rem;font-weight:700;cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:7px;transition:transform .12s,filter .2s;flex:1;min-width:120px;min-height:52px;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;box-shadow:0 8px 20px -8px var(--primary);}
.btn-success{background:linear-gradient(135deg,var(--success),var(--success-d));color:#fff;box-shadow:0 8px 20px -8px var(--success);}
.btn-print{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;box-shadow:0 8px 20px -8px #0ea5e9;}
.btn-ghost{background:var(--surface-solid);color:var(--text);border:1.5px solid var(--border);}
.btn-danger{background:var(--surface-solid);color:var(--danger);border:1.5px solid rgba(239,68,68,.4);}
.hist-item{padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-solid);margin-bottom:8px;
  cursor:pointer;transition:border-color .2s,transform .15s;display:flex;align-items:flex-start;gap:10px;}
.hist-item:active{border-color:var(--primary);}
.hist-item .h-txt{font-size:.83rem;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1;}
.hist-item .h-time{font-size:.68rem;color:var(--faint);flex:none;}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:200;}
.overlay.show{display:flex;}
.modal{background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  width:100%;max-width:520px;padding:24px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal h3{margin:0 0 4px;font-size:1.15rem;font-weight:800;}
.modal .msub{margin:0 0 18px;font-size:.82rem;color:var(--muted);}
.mfield{margin-bottom:14px;}
.mfield label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:6px;}
.mfield select,.mfield input,.mfield textarea{width:100%;padding:13px 14px;font-size:16px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--surface-solid);color:var(--text);font-family:inherit;min-height:var(--tap);}
.mfield select:focus,.mfield input:focus,.mfield textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.16);}
.mfield textarea{min-height:110px;resize:vertical;line-height:1.7;}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-btns{display:flex;gap:10px;margin-top:20px;}
.modal-btns button{flex:1;border:none;border-radius:12px;padding:15px;font-size:.92rem;font-weight:700;cursor:pointer;transition:transform .12s;min-height:52px;}
.modal-btns button:active{transform:scale(.96);}
.mb-save{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;}
.mb-cancel{background:var(--surface-solid);color:var(--text);border:1.5px solid var(--border)!important;}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(24px);background:rgba(15,23,42,.92);color:#fff;
  padding:14px 26px;border-radius:30px;font-size:.9rem;font-weight:600;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;
  transition:opacity .3s,transform .35s cubic-bezier(.34,1.56,.64,1);z-index:300;
  bottom:calc(32px + env(safe-area-inset-bottom));}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
/* Mobile sticky action bar */
.mobile-bar{display:none;}

/* ===== TABLET ===== */
@media(max-width:820px){
  .modules{grid-template-columns:1fr;}
  .info-grid{grid-template-columns:1fr 1fr;}
  .rubric-grid{grid-template-columns:1fr 1fr;}
  .item-list{max-height:300px;}
}

/* ===== PHONE ===== */
@media(max-width:640px){
  :root{--blur:7px;--tap:48px;}
  body{padding:14px 12px calc(88px + env(safe-area-inset-bottom));}
  @supports(padding:max(0px)){
    body{
      padding-top:max(14px,env(safe-area-inset-top));
      padding-left:max(12px,env(safe-area-inset-left));
      padding-right:max(12px,env(safe-area-inset-right));
    }
  }
  .wrap{max-width:100%;}

  /* top bar */
  .topbar{margin-bottom:16px;gap:10px;}
  .logo{width:44px;height:44px;font-size:1.3rem;border-radius:13px;}
  .brand{gap:11px;}
  .brand h1{font-size:1.05rem;}
  .brand p{font-size:.72rem;}
  .stat-pill{display:none;}

  /* cards */
  .card{padding:15px;margin-bottom:13px;border-radius:16px;}
  .section-title{font-size:.82rem;margin-bottom:11px;}

  /* levels: 5 equal, no subtitle */
  .levels{gap:4px;padding:5px;margin-bottom:14px;}
  .level-btn{min-width:0;flex:1;padding:0 2px;font-size:.85rem;}
  .level-btn small{display:none;}

  /* custom lib bar -> 2col grid */
  .lib-bar{padding:14px;gap:12px;}
  .lib-bar .lib-title{width:100%;}
  .lib-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-left:0!important;}
  .lib-actions button{width:100%;padding:0 8px;text-align:center;font-size:.82rem;}

  /* single column forms */
  .info-grid{grid-template-columns:1fr;gap:11px;}

  /* rubric: stack + horizontal grade bar */
  .rubric-grid{grid-template-columns:1fr;gap:22px;}
  .grade-badge{flex-direction:row;gap:14px;min-height:0;padding:14px 18px;border-radius:13px;}
  .grade-badge small{font-size:.7rem;order:1;}
  .grade-badge b{font-size:1.7rem;margin:0;order:2;}
  .grade-badge .glvl{order:3;font-size:.78rem;}

  /* nested scroll areas: taller & consistent */
  .stu-list{max-height:55vh;}
  .item-list{max-height:58vh;}
  .sel-panel{max-height:60vh;}

  /* tone: full width equal */
  .tone-row{gap:8px;}
  .tone-label{width:100%;}
  .tone-seg{width:100%;flex-wrap:nowrap;}
  .tone-seg button{flex:1;padding:12px 4px;text-align:center;}

  /* toggles: neat 2col grid */
  .out-toolbar{align-items:flex-start;gap:10px;}
  .out-toolbar .section-title{width:100%;}
  .toggles{width:100%;margin-left:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;}
  .tgl{font-size:.8rem;}

  /* action buttons: 2col grid, uniform */
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{min-width:0;padding:0 8px;font-size:.88rem;}

  textarea{min-height:200px;padding:14px;}

  /* mobile sticky bar */
  .mobile-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));
    background:var(--surface-solid);border-top:1px solid var(--border);box-shadow:0 -6px 22px -10px rgba(0,0,0,.3);}
  .mobile-bar button{flex:1;border:none;border-radius:12px;padding:15px 8px;font-size:.9rem;font-weight:800;color:#fff;cursor:pointer;transition:transform .12s;min-height:52px;}
  .mobile-bar button:active{transform:scale(.95);}
  .mb-gen{background:linear-gradient(135deg,var(--primary),var(--primary-d));}
  .mb-copy{background:linear-gradient(135deg,var(--success),var(--success-d));}
  .mb-prt{background:linear-gradient(135deg,#0ea5e9,#0284c7);}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom));}

  /* bottom-sheet modal */
  .overlay{align-items:flex-end;padding:0;}
  .modal{max-width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:slideUp .3s cubic-bezier(.4,0,.2,1);}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
}

/* very small phones */
@media(max-width:380px){
  .mrow{grid-template-columns:1fr;}
  .level-btn{font-size:.8rem;}
  .lib-actions{grid-template-columns:1fr;}
}

/* ===== PRINT REPORT ===== */
#printArea{display:none;}
@media print{
  body{background:#fff!important;padding:0;margin:0;}
  body::before{display:none!important;}
  .wrap,.overlay,.toast,.mobile-bar{display:none!important;}
  #printArea{display:block!important;color:#000;padding:34px 40px;font-family:"PingFang HK","Microsoft JhengHei",serif;}
  #printArea .p-title{text-align:center;font-size:1.5rem;font-weight:800;margin:0 0 4px;}
  #printArea .p-sub{text-align:center;font-size:.85rem;color:#555;margin:0 0 22px;letter-spacing:2px;}
  #printArea .p-info{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:.95rem;}
  #printArea .p-info td{border:1px solid #999;padding:8px 12px;}
  #printArea .p-info td.k{background:#f1f5f9;font-weight:700;width:90px;white-space:nowrap;}
  #printArea .p-rubric{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:.95rem;}
  #printArea .p-rubric th,#printArea .p-rubric td{border:1px solid #999;padding:8px 12px;text-align:center;}
  #printArea .p-rubric th{background:#f1f5f9;}
  #printArea .p-rubric .p-grade{font-size:1.3rem;font-weight:800;}
  #printArea .p-h{font-size:1.05rem;font-weight:800;border-left:5px solid #4f46e5;padding-left:10px;margin:20px 0 10px;}
  #printArea .p-body{white-space:pre-wrap;font-size:1rem;line-height:2;}
  #printArea .p-foot{margin-top:34px;display:flex;justify-content:space-between;font-size:.85rem;color:#333;}
  #printArea .p-foot .sig{border-top:1px solid #333;padding-top:6px;width:180px;text-align:center;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">📝</div>
      <div>
        <h1>中文寫作評語系統</h1>
        <p>坦克出品</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="stat-pill"><b id="statTotal">0</b><span>評語總數</span></div>
      <div class="stat-pill"><b id="statSel">0</b><span>已選取</span></div>
      <button class="icon-btn" id="themeBtn" title="切換主題">🌙</button>
    </div>
  </div>

  <div class="levels" id="levels">
    <button class="level-btn active" data-level="ALL">全部<small>All</small></button>
    <button class="level-btn" data-level="【上品】">上品<small>5** 5* 5</small></button>
    <button class="level-btn" data-level="【中品】">中品<small>Level 3-4</small></button>
    <button class="level-btn" data-level="【下品】">下品<small>Level 1-2</small></button>
    <button class="level-btn" data-level="【SEN】">SEN<small>個別化</small></button>
  </div>

  <div class="card lib-bar">
    <div class="lib-title">🗂️ 自訂評語庫 <b id="libCount">0</b> 則</div>
    <div class="lib-actions">
      <button class="prim" id="btnAddCustom">＋ 新增評語</button>
      <button id="btnExport">📤 匯出</button>
      <button id="btnImport">📥 匯入</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none;">
    </div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot"></span>學生資料 · 自動生成評語標頭（全部選填）</div>
    <div class="info-grid">
      <div class="field"><label>學生姓名 <span class="opt">(選填)</span></label><input id="fName" placeholder="例：陳大文"></div>
      <div class="field"><label>班別 <span class="opt">(選填)</span></label><input id="fClass" placeholder="例：4A"></div>
      <div class="field"><label>學號 <span class="opt">(選填)</span></label><input id="fNo" placeholder="例：12"></div>
      <div class="field"><label>作文題目 <span class="opt">(選填)</span></label><input id="fTitle" placeholder="例：重遊舊地"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot"></span>DSE 評分量表 · 拖動滑桿即時計算建議評級</div>
    <div class="rubric-grid">
      <div class="rub">
        <div class="rlab"><span>內容 <span class="w">立意・選材 40%</span></span><span class="rval" id="rvC">4</span></div>
        <input type="range" id="rC" min="1" max="7" step="1" value="4">
        <div class="rscale"><span>1</span><span>4</span><span>7</span></div>
      </div>
      <div class="rub">
        <div class="rlab"><span>文筆表達 <span class="w">修辭・語文 40%</span></span><span class="rval" id="rvE">4</span></div>
        <input type="range" id="rE" min="1" max="7" step="1" value="4">
        <div class="rscale"><span>1</span><span>4</span><span>7</span></div>
      </div>
      <div class="rub">
        <div class="rlab"><span>結構組織 <span class="w">佈局・銜接 20%</span></span><span class="rval" id="rvS">4</span></div>
        <input type="range" id="rS" min="1" max="7" step="1" value="4">
        <div class="rscale"><span>1</span><span>4</span><span>7</span></div>
      </div>
      <div class="grade-badge"><small>建議評級</small><b id="gradeVal">—</b><span class="glvl" id="gradeLvl">中品</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot"></span>班級名冊 · 批改模式（<span id="rosterCount">0</span> 人）</div>
    <div class="lib-actions" style="margin-bottom:12px;">
      <button class="prim" id="btnSaveStu">💾 儲存至名冊</button>
      <button id="btnNewStu">➕ 新學生（清空）</button>
      <button id="btnBatch">📦 批次匯出全班</button>
      <button id="btnClearRoster">🗑️ 清空名冊</button>
    </div>
    <div class="stu-list" id="stuList"></div>
  </div>

  <div class="card" style="padding:0;background:none;border:none;box-shadow:none;">
    <div class="modules" id="modules"></div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot"></span>已選評語 · 拖曳 ⠿ 或用 ↑ ↓ 調整次序</div>
    <div class="sel-panel" id="selPanel"></div>

    <div class="tone-row">
      <span class="tone-label">🎚️ 語氣風格：</span>
      <div class="tone-seg" id="toneSeg">
        <button data-tone="soft">🌱 溫和鼓勵</button>
        <button data-tone="std" class="active">⚖️ 標準</button>
        <button data-tone="strict">🔥 嚴謹直接</button>
      </div>
    </div>

    <div class="out-toolbar">
      <div class="section-title" style="margin:0;"><span class="dot"></span>最終評語（可自由編輯）</div>
      <div class="toggles">
        <label class="tgl"><input type="checkbox" id="optTags"><span class="sw"></span>顯示分類標籤</label>
        <label class="tgl"><input type="checkbox" id="optNum" checked><span class="sw"></span>顯示編號</label>
        <label class="tgl"><input type="checkbox" id="optHeader" checked><span class="sw"></span>顯示標頭</label>
        <label class="tgl"><input type="checkbox" id="optRubric" checked><span class="sw"></span>標頭含評分</label>
      </div>
    </div>
    <textarea id="output" placeholder="從上方各模塊選取評語（可多選），或按「隨機生成」…"></textarea>
    <div class="wc" id="wc">字數：0</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnGen">⚙️ 生成組合評語</button>
      <button class="btn btn-success" id="btnRand">🎲 隨機生成</button>
      <button class="btn btn-print" id="btnPrint">🖨️ 列印/PDF</button>
      <button class="btn btn-ghost" id="btnCopy">📋 複製</button>
      <button class="btn btn-ghost" id="btnDl">⬇️ 下載</button>
      <button class="btn btn-danger" id="btnClear">🗑️ 清空</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot"></span>歷史紀錄（點擊還原）</div>
    <div id="history"><div class="empty">尚無生成紀錄</div></div>
  </div>

</div>

<div class="mobile-bar">
  <button class="mb-gen" id="mbGen">⚙️ 生成</button>
  <button class="mb-copy" id="mbCopy">📋 複製</button>
  <button class="mb-prt" id="mbPrint">🖨️ 列印</button>
</div>

<div id="printArea"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">新增自訂評語</h3>
    <p class="msub">建立你自己的評語，將顯示於對應模塊中並可重複使用。</p>
    <div class="mrow">
      <div class="mfield">
        <label>所屬模塊</label>
        <select id="mMod">
          <option value="str">優點 Strengths</option>
          <option value="weak_c">缺點 · 內容</option>
          <option value="weak_e">缺點 · 表達</option>
          <option value="sugg">建議與改正</option>
        </select>
      </div>
      <div class="mfield">
        <label>等級</label>
        <select id="mLevel">
          <option value="【上品】">上品</option>
          <option value="【中品】">中品</option>
          <option value="【下品】">下品</option>
          <option value="【SEN】">SEN</option>
        </select>
      </div>
    </div>
    <div class="mfield">
      <label>分類名稱</label>
      <input id="mCat" placeholder="例：審題立意、修辭表達（可留空）">
    </div>
    <div class="mfield">
      <label>評語內容 *</label>
      <textarea id="mBody" placeholder="輸入評語內容…"></textarea>
    </div>
    <div class="modal-btns">
      <button class="mb-cancel" id="mCancel">取消</button>
      <button class="mb-save" id="mSave">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ 已複製</div>

<script>

/* ===== Rubric grading ===== */
function computeGrade(c,e,s){
  const w=c*0.4+e*0.4+s*0.2;
  let grade,lvl;
  if(w>=6.6){grade='5**';}else if(w>=6.1){grade='5*';}else if(w>=5.5){grade='5';}
  else if(w>=4.5){grade='4';}else if(w>=3.5){grade='3';}else if(w>=2.5){grade='2';}else{grade='1';}
  if(w>=5.5)lvl='上品';else if(w>=3.5)lvl='中品';else lvl='下品';
  return {grade,lvl,w:w.toFixed(1)};
}
function getRubric(){return{c:+document.getElementById('rC').value,e:+document.getElementById('rE').value,s:+document.getElementById('rS').value};}
function setRubric(r){r=r||{c:4,e:4,s:4};document.getElementById('rC').value=r.c;document.getElementById('rE').value=r.e;document.getElementById('rS').value=r.s;updateRubricUI();}
function updateRubricUI(){
  const r=getRubric();
  document.getElementById('rvC').textContent=r.c;document.getElementById('rvE').textContent=r.e;document.getElementById('rvS').textContent=r.s;
  const g=computeGrade(r.c,r.e,r.s);
  document.getElementById('gradeVal').textContent=g.grade;
  document.getElementById('gradeLvl').textContent=g.lvl;
}

function loadStore(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);MODS.forEach(m=>{if(Array.isArray(o[m.id]))customData[m.id]=o[m.id];});}}catch(_){}}
function persistRoster(){try{localStorage.setItem(LS_ROSTER,JSON.stringify({roster,nextId}));}catch(_){}}
function loadRoster(){try{const raw=localStorage.getItem(LS_ROSTER);if(raw){const o=JSON.parse(raw);if(Array.isArray(o.roster)){roster=o.roster;nextId=o.nextId||(roster.reduce((m,s)=>Math.max(m,s.id),0)+1);}}}catch(_){}}

/* ===== Helpers ===== */
function val(id){return document.getElementById(id).value;}
function setVal(id,v){document.getElementById(id).value=v||'';}
function getInfo(){return{name:val('fName'),cls:val('fClass'),no:val('fNo'),title:val('fTitle')};}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function arrMove(a,from,to){if(to<0||to>=a.length||from<0||from>=a.length)return;const [x]=a.splice(from,1);a.splice(to,0,x);}
function parse(t){let m=t.match(/^【([^】]+)】【([^】]+)】([\s\S]*)$/);if(m)return{level:'【'+m[1]+'】',cat:m[2],body:m[3]};m=t.match(/^【([^】]+)】([\s\S]*)$/);return{level:'【'+m[1]+'】',cat:'綜合',body:m[2]};}
function matchesLevel(lv){return state.level==='ALL'||lv===state.level;}
function getAllItems(mod){
  const list=[];
  mod.data.forEach((t,i)=>{const p=parse(t);list.push({key:'o'+i,level:p.level,cat:p.cat,body:p.body,full:t,custom:false,ci:-1});});
  customData[mod.id].forEach((c,i)=>{const cat=c.cat&&c.cat.trim()?c.cat.trim():'自訂';const full=c.level+'【'+cat+'】'+c.body;list.push({key:'c'+i,level:c.level,cat:cat,body:c.body,full,custom:true,ci:i});});
  return list;
}
function getCats(mod){const s=new Set();getAllItems(mod).forEach(it=>{if(matchesLevel(it.level))s.add(it.cat);});return [...s];}
function filteredItems(mod){const q=state.search[mod.id].trim();const sc=state.subcat[mod.id];return getAllItems(mod).filter(it=>{if(!matchesLevel(it.level))return false;if(sc!=='ALL'&&it.cat!==sc)return false;if(q&&it.full.indexOf(q)===-1)return false;return true;});}
function itemByKey(mod,key){return getAllItems(mod).find(it=>it.key===key);}
function isSel(mod,key){return state.selected[mod].includes(key);}
function toggleSel(mod,key){const a=state.selected[mod];const i=a.indexOf(key);if(i>=0)a.splice(i,1);else a.push(key);}

/* ===== Icons ===== */
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
const SEARCHICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M21 21l-4-4"/></svg>';
const EDIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 4H4v16h16v-7M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4z"/></svg>';
const TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
const GRIP='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
const UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></svg>';
const DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>';
const XICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>';

/* ===== Render modules ===== */
function renderModules(){
  const c=document.getElementById('modules');c.innerHTML='';
  MODS.forEach(mod=>{
    const card=document.createElement('div');card.className='card';card.style.marginBottom='0';card.dataset.mod=mod.id;
    const cats=getCats(mod);const selCount=state.selected[mod.id].length;
    card.innerHTML=`
      <div class="mod-head">
        <div class="mod-ico ${mod.ico}">${mod.emoji}</div>
        <div class="mh-txt"><div class="t">${mod.label}</div><div class="s">${mod.sub}</div></div>
        <button class="add-mini" data-add="${mod.id}">＋ 自訂</button>
        <div class="count-badge ${selCount?'':'zero'}">${selCount}</div>
      </div>
      <div class="search-box">${SEARCHICO}<input type="text" placeholder="搜尋關鍵字…" data-search="${mod.id}" value="${esc(state.search[mod.id])}"></div>
      <div class="subcats">
        <button class="subcat ${state.subcat[mod.id]==='ALL'?'active':''}" data-sc="${mod.id}" data-val="ALL">全部類別</button>
        ${cats.map(cat=>`<button class="subcat ${state.subcat[mod.id]===cat?'active':''}" data-sc="${mod.id}" data-val="${esc(cat)}">${esc(cat)}</button>`).join('')}
      </div>
      <div class="item-list" data-list="${mod.id}"></div>`;
    c.appendChild(card);renderList(mod);
  });
  updateStats();
}
function renderList(mod){
  const box=document.querySelector(`[data-list="${mod.id}"]`);if(!box)return;
  const items=filteredItems(mod);
  if(!items.length){box.innerHTML='<div class="empty">此篩選下沒有相符的評語</div>';return;}
  box.innerHTML=items.map(it=>{
    const sel=isSel(mod.id,it.key);
    const acts=it.custom?`<div class="item-acts"><button data-edit="${mod.id}" data-ci="${it.ci}" title="編輯">${EDIT}</button><button class="del" data-del="${mod.id}" data-ci="${it.ci}" title="刪除">${TRASH}</button></div>`:'';
    return `<div class="item ${sel?'sel':''} ${it.custom?'is-custom':''}" data-pick="${mod.id}" data-key="${it.key}"><span class="tick">${CHECK}</span><span class="cat-tag">${esc(it.cat)}</span>${it.custom?'<span class="custom-tag">自訂</span>':''}<br>${esc(it.body)}${acts}</div>`;
  }).join('');
}
function updateStats(){
  let tot=0;MODS.forEach(m=>tot+=m.data.length+customData[m.id].length);document.getElementById('statTotal').textContent=tot;
  let sel=0;MODS.forEach(m=>sel+=state.selected[m.id].length);document.getElementById('statSel').textContent=sel;
  let cust=0;MODS.forEach(m=>cust+=customData[m.id].length);document.getElementById('libCount').textContent=cust;
  MODS.forEach(mod=>{const b=document.querySelector(`[data-mod="${mod.id}"] .count-badge`);if(b){const n=state.selected[mod.id].length;b.textContent=n;b.classList.toggle('zero',!n);}});
}

/* ===== Selected / reorder panel ===== */
function renderSelected(){
  const box=document.getElementById('selPanel');
  const any=MODS.some(m=>state.selected[m.id].length);
  if(!any){box.innerHTML='<div class="empty">尚未選取評語。從上方模塊點選，已選項目會在此顯示，可拖曳 ⠿ 或用 ↑ ↓ 調整次序。</div>';return;}
  let html='';
  MODS.forEach(mod=>{
    const arr=state.selected[mod.id];if(!arr.length)return;
    html+=`<div class="sel-group"><div class="sel-group-title">${mod.emoji} ${mod.section}</div>`;
    arr.forEach((key,idx)=>{
      const it=itemByKey(mod,key);if(!it)return;
      html+=`<div class="sel-item" draggable="true" data-mod="${mod.id}" data-idx="${idx}">
        <span class="grip">${GRIP}</span>
        <span class="sel-body">${esc(it.body)}</span>
        <span class="sel-btns">
          <button data-up="${mod.id}" data-idx="${idx}" title="上移">${UP}</button>
          <button data-down="${mod.id}" data-idx="${idx}" title="下移">${DOWN}</button>
          <button class="rmv" data-rmv="${mod.id}" data-idx="${idx}" title="移除">${XICO}</button>
        </span></div>`;
    });
    html+='</div>';
  });
  box.innerHTML=html;
}

/* ===== Compose output ===== */
function composeComment(info, sel, tone, forceHeader, rubric){
  const showTags=document.getElementById('optTags').checked;
  const showNum=document.getElementById('optNum').checked;
  const showHeader=forceHeader||document.getElementById('optHeader').checked;
  const showRubric=document.getElementById('optRubric').checked;
  let out=[];
  if(showHeader){
    const nm=(info.name||'').trim(),cl=(info.cls||'').trim(),no=(info.no||'').trim(),ti=(info.title||'').trim();
    let parts=[];
    if(nm)parts.push('學生：'+nm);
    if(cl)parts.push('班別：'+cl);
    if(no)parts.push('學號：'+no);
    let head=[];
    if(parts.length)head.push(parts.join('　'));
    if(ti)head.push('題目：《'+ti+'》');
    if(showRubric&&rubric){const g=computeGrade(rubric.c,rubric.e,rubric.s);head.push(`評分：內容 ${rubric.c}／文筆 ${rubric.e}／結構 ${rubric.s}　建議評級：${g.grade}（${g.lvl}）`);}
    const d=new Date();head.push('評改日期：'+`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`);
    out=out.concat(head);out.push('─────────────────');
  }
  const intro=TONE[tone].intro;if(intro){out.push(intro);out.push('');}
  MODS.forEach(mod=>{
    const arr=sel[mod.id]||[];if(!arr.length)return;
    const chosen=arr.map(k=>itemByKey(mod,k)).filter(Boolean);if(!chosen.length)return;
    out.push(mod.section);
    chosen.forEach((it,n)=>{let line=showTags?it.full:it.body;line=applyTone(line,tone);out.push((showNum?(n+1)+'. ':'')+line);});
    out.push('');
  });
  const outro=TONE[tone].outro;if(outro){out.push(outro);}
  return out.join('\n').trim();
}
function hasSelection(){return MODS.some(m=>state.selected[m.id].length);}
function refreshOutput(){
  syncActive();renderSelected();updateStats();
  document.getElementById('output').value=hasSelection()?composeComment(getInfo(),state.selected,state.tone,false,getRubric()):'';
  countWords();
}
function countWords(){const v=document.getElementById('output').value.replace(/\s/g,'');document.getElementById('wc').textContent='字數：'+v.length;}

/* ===== Roster ===== */
function renderRoster(){
  const box=document.getElementById('stuList');
  document.getElementById('rosterCount').textContent=roster.length;
  persistRoster();
  if(!roster.length){box.innerHTML='<div class="empty">名冊暫時是空的。填寫上方學生資料並選取評語後，按「儲存至名冊」加入。</div>';return;}
  box.innerHTML=roster.map(st=>{
    const cnt=MODS.reduce((s,m)=>s+((st.selected&&st.selected[m.id])?st.selected[m.id].length:0),0);
    const init=(st.name||'?').slice(0,1);
    const sub=[st.cls?('班別 '+st.cls):'',st.no?('學號 '+st.no):''].filter(Boolean).join('・')||'—';
    const r=st.rubric;const g=r?computeGrade(r.c,r.e,r.s).grade:'';
    return `<div class="stu ${st.id===activeId?'active':''}" data-stu="${st.id}">
      <span class="avatar">${esc(init)}</span>
      <span class="stu-meta"><span class="stu-name">${esc(st.name||'（未命名）')}</span><span class="stu-sub">${esc(sub)}</span></span>
      ${g?`<span class="stu-grade">${g}</span>`:''}
      <span class="count-badge ${cnt?'':'zero'}">${cnt}</span>
      <button class="stu-del" data-studel="${st.id}" title="刪除">${TRASH}</button>
    </div>`;
  }).join('');
}
function syncActive(){
  if(activeId==null)return;
  const st=roster.find(s=>s.id===activeId);if(!st)return;
  const info=getInfo();
  st.name=info.name;st.cls=info.cls;st.no=info.no;st.title=info.title;
  st.selected=JSON.parse(JSON.stringify(state.selected));
  st.rubric=getRubric();
  renderRoster();
}
function loadStudent(id){
  syncActive();
  const st=roster.find(s=>s.id===id);if(!st)return;
  activeId=id;
  setVal('fName',st.name);setVal('fClass',st.cls);setVal('fNo',st.no);setVal('fTitle',st.title);
  state.selected=JSON.parse(JSON.stringify(st.selected||{}));
  MODS.forEach(m=>{if(!Array.isArray(state.selected[m.id]))state.selected[m.id]=[];});
  setRubric(st.rubric);
  renderModules();renderSelected();
  document.getElementById('output').value=hasSelection()?composeComment(getInfo(),state.selected,state.tone,false,getRubric()):'';
  countWords();renderRoster();
  toast('已載入：'+(st.name||'學生'));
}
function newStudent(){
  syncActive();activeId=null;
  ['fName','fClass','fNo','fTitle'].forEach(id=>setVal(id,''));
  MODS.forEach(m=>state.selected[m.id]=[]);
  setRubric({c:4,e:4,s:4});
  renderModules();renderSelected();
  document.getElementById('output').value='';countWords();renderRoster();
  toast('已清空，開始新學生');
}
function saveToRoster(){
  const info=getInfo();
  if(activeId!=null){syncActive();toast('已更新名冊資料');}
  else{
    if(!info.name.trim()){toast('請先輸入學生姓名');return;}
    const st={id:nextId++,name:info.name,cls:info.cls,no:info.no,title:info.title,selected:JSON.parse(JSON.stringify(state.selected)),rubric:getRubric()};
    roster.push(st);activeId=st.id;toast('已加入名冊');
  }
  renderRoster();
}
function deleteStudent(id){
  const i=roster.findIndex(s=>s.id===id);if(i<0)return;
  roster.splice(i,1);if(activeId===id)activeId=null;
  renderRoster();
}
function batchExport(){
  if(!roster.length){toast('名冊是空的');return;}
  syncActive();
  const blocks=roster.map(st=>composeComment(st,st.selected||{},state.tone,true,st.rubric));
  const text=blocks.join('\n\n════════════════════\n\n');
  const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='全班寫作評語.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('已匯出全班 '+roster.length+' 份評語');
}

/* ===== Print report ===== */
function buildReport(info,sel,tone,rubric,commentText){
  const nm=(info.name||'').trim()||'—',cl=(info.cls||'').trim()||'—',no=(info.no||'').trim()||'—',ti=(info.title||'').trim()||'—';
  const g=computeGrade(rubric.c,rubric.e,rubric.s);
  const d=new Date();const dstr=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  let body=composeComment(info,sel,tone,false,rubric);
  return `
    <div class="p-title">中文寫作評改報告</div>
    <div class="p-sub">坦克出品</div>
    <table class="p-info">
      <tr><td class="k">學生姓名</td><td>${esc(nm)}</td><td class="k">班別</td><td>${esc(cl)}</td><td class="k">學號</td><td>${esc(no)}</td></tr>
      <tr><td class="k">作文題目</td><td colspan="3">《${esc(ti)}》</td><td class="k">評改日期</td><td>${esc(dstr)}</td></tr>
    </table>
    <table class="p-rubric">
      <tr><th>內容（立意・選材）</th><th>文筆表達（修辭・語文）</th><th>結構組織（佈局・銜接）</th><th>加權分</th><th>建議評級</th></tr>
      <tr><td>${rubric.c} / 7</td><td>${rubric.e} / 7</td><td>${rubric.s} / 7</td><td>${g.w} / 7</td><td class="p-grade">${g.grade}<br><span style="font-size:.8rem;font-weight:600;">（${g.lvl}）</span></td></tr>
    </table>
    <div class="p-h">評改內容</div>
    <div class="p-body">${esc(commentText||body)}</div>
    <div class="p-foot"><div class="sig">教師簽署</div><div class="sig">家長簽署</div></div>
  `;
}
function printReport(){
  syncActive();
  const info=getInfo();
  const txt=document.getElementById('output').value.trim();
  const comment=txt||composeComment(info,state.selected,state.tone,false,getRubric());
  if(!comment){toast('請先生成評語再列印');return;}
  document.getElementById('printArea').innerHTML=buildReport(info,state.selected,state.tone,getRubric(),comment);
  setTimeout(()=>{window.print();},60);
}

/* ===== History ===== */
function pushHistory(txt){if(!txt.trim())return;const d=new Date();history.unshift({txt,time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`});if(history.length>6)history.pop();renderHistory();}
function renderHistory(){const c=document.getElementById('history');if(!history.length){c.innerHTML='<div class="empty">尚無生成紀錄</div>';return;}c.innerHTML=history.map((h,i)=>`<div class="hist-item" data-hist="${i}"><span class="h-time">${h.time}</span><span class="h-txt">${esc(h.txt).slice(0,120)}…</span></div>`).join('');}

/* ===== Toast ===== */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ===== Custom modal ===== */
function openModal(modId,ci){
  editState=(ci!=null&&ci>=0)?{mod:modId,ci}:null;
  document.getElementById('modalTitle').textContent=editState?'編輯自訂評語':'新增自訂評語';
  document.getElementById('mMod').value=modId||'str';
  if(editState){const c=customData[modId][ci];document.getElementById('mLevel').value=c.level;document.getElementById('mCat').value=c.cat||'';document.getElementById('mBody').value=c.body;}
  else{document.getElementById('mLevel').value=state.level!=='ALL'?state.level:'【中品】';document.getElementById('mCat').value='';document.getElementById('mBody').value='';}
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>document.getElementById('mBody').focus(),100);
}
function closeModal(){document.getElementById('overlay').classList.remove('show');editState=null;}
function saveCustom(){
  const modId=document.getElementById('mMod').value;
  const level=document.getElementById('mLevel').value;
  const cat=document.getElementById('mCat').value.trim()||'自訂';
  const body=document.getElementById('mBody').value.trim();
  if(!body){toast('請輸入評語內容');return;}
  if(editState){customData[editState.mod].splice(editState.ci,1);state.selected[editState.mod]=state.selected[editState.mod].filter(k=>k[0]!=='c');}
  customData[modId].push({level,cat,body});
  persist();closeModal();
  if(state.subcat[modId]!=='ALL'&&state.subcat[modId]!==cat)state.subcat[modId]='ALL';
  const wasEdit=!!editState;renderModules();refreshOutput();
  toast(wasEdit?'已更新評語':'已新增自訂評語');
}
function deleteCustom(modId,ci){
  customData[modId].splice(ci,1);
  state.selected[modId]=state.selected[modId].filter(k=>k[0]!=='c');
  persist();renderModules();refreshOutput();toast('已刪除自訂評語');
}

/* ===== Events ===== */
document.getElementById('levels').addEventListener('click',e=>{const b=e.target.closest('.level-btn');if(!b)return;document.querySelectorAll('.level-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.level=b.dataset.level;MODS.forEach(m=>state.subcat[m.id]='ALL');renderModules();});

document.getElementById('toneSeg').addEventListener('click',e=>{const b=e.target.closest('[data-tone]');if(!b)return;state.tone=b.dataset.tone;document.querySelectorAll('#toneSeg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');refreshOutput();});

['rC','rE','rS'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{updateRubricUI();refreshOutput();}));

document.addEventListener('click',e=>{
  const add=e.target.closest('[data-add]');if(add){openModal(add.dataset.add);return;}
  const ed=e.target.closest('[data-edit]');if(ed){e.stopPropagation();openModal(ed.dataset.edit,+ed.dataset.ci);return;}
  const del=e.target.closest('[data-del]');if(del){e.stopPropagation();deleteCustom(del.dataset.del,+del.dataset.ci);return;}
  const up=e.target.closest('[data-up]');if(up){arrMove(state.selected[up.dataset.up],+up.dataset.idx,+up.dataset.idx-1);refreshOutput();return;}
  const dn=e.target.closest('[data-down]');if(dn){arrMove(state.selected[dn.dataset.down],+dn.dataset.idx,+dn.dataset.idx+1);refreshOutput();return;}
  const rmv=e.target.closest('[data-rmv]');if(rmv){const m=rmv.dataset.rmv;state.selected[m].splice(+rmv.dataset.idx,1);renderList(modById(m));refreshOutput();return;}
  const pick=e.target.closest('[data-pick]');if(pick){const mid=pick.dataset.pick,key=pick.dataset.key;toggleSel(mid,key);pick.classList.toggle('sel');pick.querySelector('.tick').classList.toggle('sel');refreshOutput();return;}
  const sc=e.target.closest('[data-sc]');if(sc){const mid=sc.dataset.sc;state.subcat[mid]=sc.dataset.val;document.querySelectorAll(`[data-sc="${mid}"]`).forEach(x=>x.classList.remove('active'));sc.classList.add('active');renderList(modById(mid));return;}
  const h=e.target.closest('[data-hist]');if(h){document.getElementById('output').value=history[+h.dataset.hist].txt;countWords();toast('已還原紀錄');return;}
});

document.getElementById('stuList').addEventListener('click',e=>{
  const del=e.target.closest('[data-studel]');if(del){e.stopPropagation();deleteStudent(+del.dataset.studel);return;}
  const stu=e.target.closest('[data-stu]');if(stu){loadStudent(+stu.dataset.stu);return;}
});

/* ===== Desktop drag reorder ===== */
const selPanel=document.getElementById('selPanel');
selPanel.addEventListener('dragstart',e=>{const it=e.target.closest('.sel-item');if(!it)return;dragSrc={mod:it.dataset.mod,idx:+it.dataset.idx};it.classList.add('dragging');});
selPanel.addEventListener('dragend',e=>{const it=e.target.closest('.sel-item');if(it)it.classList.remove('dragging');document.querySelectorAll('.sel-item.dragover').forEach(x=>x.classList.remove('dragover'));});
selPanel.addEventListener('dragover',e=>{e.preventDefault();const it=e.target.closest('.sel-item');document.querySelectorAll('.sel-item.dragover').forEach(x=>x.classList.remove('dragover'));if(it&&dragSrc&&it.dataset.mod===dragSrc.mod)it.classList.add('dragover');});
selPanel.addEventListener('drop',e=>{e.preventDefault();const it=e.target.closest('.sel-item');if(!it||!dragSrc)return;const tMod=it.dataset.mod,tIdx=+it.dataset.idx;if(tMod!==dragSrc.mod){dragSrc=null;return;}arrMove(state.selected[tMod],dragSrc.idx,tIdx);dragSrc=null;refreshOutput();});

/* ===== Touch drag reorder (iOS / Android) ===== */
selPanel.addEventListener('touchstart',e=>{
  const grip=e.target.closest('.grip');if(!grip)return;
  const it=grip.closest('.sel-item');if(!it)return;
  touchDrag={mod:it.dataset.mod,idx:+it.dataset.idx,el:it};
  it.classList.add('dragging');
  e.preventDefault();
},{passive:false});
selPanel.addEventListener('touchmove',e=>{
  if(!touchDrag)return;
  e.preventDefault();
  const t=e.touches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  const over=el&&el.closest('.sel-item');
  document.querySelectorAll('.sel-item.dragover').forEach(x=>x.classList.remove('dragover'));
  if(over&&over!==touchDrag.el&&over.dataset.mod===touchDrag.mod)over.classList.add('dragover');
},{passive:false});
selPanel.addEventListener('touchend',()=>{
  if(!touchDrag)return;
  const over=document.querySelector('.sel-item.dragover');
  const src=touchDrag;touchDrag=null;
  if(over&&over.dataset.mod===src.mod){arrMove(state.selected[src.mod],src.idx,+over.dataset.idx);refreshOutput();return;}
  src.el.classList.remove('dragging');
});
selPanel.addEventListener('touchcancel',()=>{if(touchDrag){touchDrag.el.classList.remove('dragging');touchDrag=null;document.querySelectorAll('.sel-item.dragover').forEach(x=>x.classList.remove('dragover'));}});

document.addEventListener('input',e=>{if(e.target.dataset.search){const mid=e.target.dataset.search;state.search[mid]=e.target.value;renderList(modById(mid));}});
document.getElementById('output').addEventListener('input',countWords);
['optTags','optNum','optHeader','optRubric'].forEach(id=>document.getElementById(id).addEventListener('change',refreshOutput));
['fName','fClass','fNo','fTitle'].forEach(id=>document.getElementById(id).addEventListener('input',refreshOutput));

document.getElementById('btnGen').addEventListener('click',()=>{if(!hasSelection()){toast('請先選取評語');return;}refreshOutput();pushHistory(document.getElementById('output').value);toast('已生成評語');});

document.getElementById('btnRand').addEventListener('click',()=>{
  MODS.forEach(mod=>{const items=filteredItems(mod);state.selected[mod.id]=[];if(items.length){const pool=[...items];const n=(mod.id==='weak_c'||mod.id==='weak_e')?(1+Math.floor(Math.random()*2)):1;for(let k=0;k<n&&pool.length;k++){const r=Math.floor(Math.random()*pool.length);state.selected[mod.id].push(pool.splice(r,1)[0].key);}}});
  MODS.forEach(m=>renderList(m));refreshOutput();pushHistory(document.getElementById('output').value);toast('已隨機生成');});

document.getElementById('btnPrint').addEventListener('click',printReport);

document.getElementById('btnCopy').addEventListener('click',async()=>{const ta=document.getElementById('output');if(!ta.value.trim()){toast('沒有內容可複製');return;}try{await navigator.clipboard.writeText(ta.value);toast('✅ 已複製到剪貼簿');}catch(_){ta.select();ta.setSelectionRange(0,99999);document.execCommand('copy');toast('✅ 已複製');}});

document.getElementById('btnDl').addEventListener('click',()=>{const ta=document.getElementById('output');if(!ta.value.trim()){toast('沒有內容可下載');return;}const nm=val('fName').trim()||'學生';const blob=new Blob(['\ufeff'+ta.value],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`寫作評語_${nm}.txt`;document.body.appendChild(a);a.click();document.body.removeChild(a);toast('已下載檔案');});

document.getElementById('btnClear').addEventListener('click',()=>{MODS.forEach(m=>state.selected[m.id]=[]);MODS.forEach(m=>renderList(m));syncActive();renderSelected();updateStats();document.getElementById('output').value='';countWords();toast('已清空');});

document.getElementById('themeBtn').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',state.theme);document.getElementById('themeBtn').textContent=state.theme==='dark'?'☀️':'🌙';});

/* mobile sticky bar */
document.getElementById('mbGen').addEventListener('click',()=>document.getElementById('btnGen').click());
document.getElementById('mbCopy').addEventListener('click',()=>document.getElementById('btnCopy').click());
document.getElementById('mbPrint').addEventListener('click',()=>document.getElementById('btnPrint').click());

/* roster buttons */
document.getElementById('btnSaveStu').addEventListener('click',saveToRoster);
document.getElementById('btnNewStu').addEventListener('click',newStudent);
document.getElementById('btnBatch').addEventListener('click',batchExport);
document.getElementById('btnClearRoster').addEventListener('click',()=>{if(!roster.length){toast('名冊已是空的');return;}roster=[];activeId=null;renderRoster();toast('已清空名冊');});

/* custom lib buttons */
document.getElementById('btnAddCustom').addEventListener('click',()=>openModal('str'));
document.getElementById('mSave').addEventListener('click',saveCustom);
document.getElementById('mCancel').addEventListener('click',closeModal);
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.getElementById('btnExport').addEventListener('click',()=>{let cnt=0;MODS.forEach(m=>cnt+=customData[m.id].length);if(!cnt){toast('尚無自訂評語可匯出');return;}const blob=new Blob([JSON.stringify(customData,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='自訂評語庫.json';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('已匯出自訂評語庫');});
document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);let added=0;MODS.forEach(m=>{if(Array.isArray(o[m.id])){o[m.id].forEach(c=>{if(c&&c.level&&c.body){customData[m.id].push({level:c.level,cat:c.cat||'自訂',body:c.body});added++;}});}});persist();renderModules();refreshOutput();toast(`已匯入 ${added} 則自訂評語`);}catch(_){toast('匯入失敗：檔案格式錯誤');}};rd.readAsText(f);e.target.value='';});

/* ===== Init ===== */
loadStore();loadRoster();
updateRubricUI();
renderModules();renderRoster();renderSelected();countWords();

}catch(e){
  document.body.innerHTML="<h2 style='color:#ef4444;text-align:center;margin-top:60px;'>系統載入失敗</h2><p style='text-align:center;'>錯誤："+e.message+"</p>";
}
</script>
</body>
</html>
